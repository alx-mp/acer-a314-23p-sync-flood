# Destino: /etc/sysctl.d/99-ram.conf   (aplicar: sysctl --system)
# Semántica documentada en https://docs.kernel.org/admin-guide/sysctl/vm.html
# Valores concretos = los que usa Pop!_OS por defecto con zram+zstd
# (https://github.com/pop-os/default-settings/pull/163); NO son recomendaciones del kernel.

# 0..200. "For in-memory swap, like zram or zswap ... values beyond 100 can be considered."
# APLICADO 133 porque SI se añadió el swapfile en disco (ver 06-swapfile-btrfs.sh).
vm.swappiness = 133

# "Zero disables swap readahead completely." Sin readahead no se descomprimen 8 páginas
# por cada fallo de página en zram. Pop!_OS: 0 para zstd.
vm.page-cluster = 0

# "A boost factor of 0 will disable the feature." Evita reclaim extra motivado por
# fragmentación (pensado para THP/hugetlbfs), no por falta de memoria.
vm.watermark_boost_factor = 0

# Por defecto 10 (0,1 % de la RAM entre marcas de agua). 125 = 1,25 % (~90 MB en 7 GiB):
# kswapd despierta antes y hay menos reclaim directo (stalls) en las aplicaciones.
vm.watermark_scale_factor = 125
