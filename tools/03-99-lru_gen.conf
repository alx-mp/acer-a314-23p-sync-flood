# Destino: /etc/tmpfiles.d/99-lru_gen.conf   (aplicar: systemd-tmpfiles --create /etc/tmpfiles.d/99-lru_gen.conf)
# MGLRU, https://docs.kernel.org/admin-guide/mm/multigen_lru.html :
#  "Users can write N to min_ttl_ms to prevent the working set of N milliseconds from getting
#   evicted. The OOM killer is triggered if this working set cannot be kept in memory."
#  "Based on the average human detectable lag (~100ms), N=1000 usually eliminates intolerable
#   janks due to thrashing."  Valor por defecto 0 = desactivado.
# enabled ya es 0x0007 (todos los componentes) por CONFIG_LRU_GEN_ENABLED=y; no se toca.
w /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
