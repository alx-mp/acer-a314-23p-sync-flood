# Destino: /etc/systemd/zram-generator.conf   (man zram-generator.conf(5))
# Sustituye por completo al fichero del proveedor /usr/lib/systemd/zram-generator.conf
# (Fedora: zram-size = min(ram, 8192), algoritmo = por defecto del kernel = lzo-rle).
#
# Cambio propuesto: mismo tamaño que Fedora (documentado en
# https://fedoraproject.org/wiki/Changes/Scale_ZRAM_to_full_memory_size), pero con zstd,
# que comprime mejor (menos RAM ocupada por las páginas comprimidas cuando el swap se llena).
# Los cambios de tamaño/algoritmo sólo se aplican al recrear el dispositivo (reinicio, o
# swapoff /dev/zram0 && systemctl restart systemd-zram-setup@zram0.service).
#
# Alternativa más conservadora (menos capacidad, OOM antes pero con menos RAM
# secuestrada por zram):   zram-size = ram / 2
[zram0]
zram-size = min(ram, 8192)
compression-algorithm = zstd
swap-priority = 100
