# Destino: /etc/systemd/user/app.slice.d/50-oomd.conf   (aplicar: systemctl --user -M USER@ daemon-reload)
# Estado actual (Fedora 44, systemd-oomd-defaults 259.8): /usr/lib/systemd/user/slice.d/10-oomd-per-slice-defaults.conf
#   ManagedOOMMemoryPressure=kill  ManagedOOMMemoryPressureLimit=80%   (20 s, /usr/lib/systemd/oomd.conf.d/10-oomd-defaults.conf)
#   y NINGUNA unidad con ManagedOOMSwap=kill  ->  "oomctl dump" muestra "Swap Monitored CGroups:" vacío.
# Este drop-in afecta sólo a app.slice del gestor de usuario (Chrome, Firefox, GNOME Boxes/qemu,
# terminales, Claude Code); session.slice (gnome-shell) conserva el 80 % del proveedor.
#  - 50 % fue el valor por defecto de Fedora 34-37 para user@.service
#    (https://fedoraproject.org/wiki/Changes/EnableSystemdOomd); man systemd-oomd.service sugiere
#    "something like user@$UID.service may prefer a much lower value like 40%".
#  - ManagedOOMSwap=kill: cuando memoria usada Y swap usado superan SwapUsedLimit (90 % por defecto,
#    man oomd.conf), oomd mata el cgroup hijo con más swap (>5 % del total), es decir, la VM o un
#    proceso de Chrome, antes de que el kernel llegue a "Free swap = 0kB".
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
ManagedOOMSwap=kill
